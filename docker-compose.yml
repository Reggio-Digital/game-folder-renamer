services:
  game-renamer:
    image: game-renamer
    build: .
    ports:
      - "8501:8501"
    environment:
      - IGDB_CLIENT_ID=your_client_id_here  # Get from Twitch Developer Console
      - IGDB_CLIENT_SECRET=your_client_secret_here  # Get from Twitch Developer Console
      - GAMES_FOLDER=/games
    volumes:
      - "path/to/games:/games"
